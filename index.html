<style>
/* Layout: texte à gauche, portrait à droite (miroir en arabe), panneau de recherche sombre, puis sections en lignes. */
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --text:#0F1D3A;
  --muted:#55607A;
  --line:#DADFE8;
  --accent:#B83A63;
  --accent-strong:#962D50;
  --accent-wash:#F7E4EA;
  --link:#962D50;
  --panel:#0F1D3A;
  --panel-text:#FFFFFF;
  --panel-muted:#B9C2D8;
  --panel-line:#4A5878;
  --panel-hover:#1D2D54;
  --panel-card:#FFFFFF;
  --panel-card-text:#0F1D3A;
  --on-accent:#FFFFFF;
  --marker:#FFE58A;
  --marker-text:#0F1D3A;
  --radius:10px;
  --gutter:20px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --arabic:"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220;
    --surface:#161D31;
    --text:#E9EDF7;
    --muted:#9FAAC6;
    --line:#262F49;
    --accent:#C2406C;
    --accent-strong:#D8557F;
    --accent-wash:#2A1A2C;
    --link:#F296B5;
    --panel:#161D31;
    --panel-text:#F2F5FB;
    --panel-muted:#A9B4CF;
    --panel-line:#3A466A;
    --panel-hover:#222B47;
    --panel-card:#0D1220;
    --panel-card-text:#E9EDF7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220;
  --surface:#161D31;
  --text:#E9EDF7;
  --muted:#9FAAC6;
  --line:#262F49;
  --accent:#C2406C;
  --accent-strong:#D8557F;
  --accent-wash:#2A1A2C;
  --link:#F296B5;
  --panel:#161D31;
  --panel-text:#F2F5FB;
  --panel-muted:#A9B4CF;
  --panel-line:#3A466A;
  --panel-hover:#222B47;
  --panel-card:#0D1220;
  --panel-card-text:#E9EDF7;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
[hidden]{display:none !important}
a{color:var(--link);text-underline-offset:3px}
a:hover{color:var(--text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* arabe : police, interligne, pas de tracking négatif */
:lang(ar) body,:lang(ar) input,:lang(ar) button{font-family:var(--body),var(--arabic)}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3,:lang(ar) .brand{font-family:var(--display),var(--arabic);letter-spacing:0}
:lang(ar) body{line-height:1.85}
:lang(ar) h1{line-height:1.15}

/* en-tête */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px 20px;flex-wrap:wrap;padding-block:16px}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--text);text-decoration:none}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.tools nav{display:flex;gap:16px;font-size:.95rem;flex-wrap:wrap}
.tools nav a{color:var(--muted);text-decoration:none;padding:4px 0}
.tools nav a:hover{color:var(--text);text-decoration:underline}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{font:inherit;font-size:.9rem;padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:36px}
.langs button + button{border-inline-start:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.theme{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;min-height:36px}
.theme:hover,.langs button:hover{border-color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:14px 0 34px;align-items:center}
.hero-photo{width:min(190px,56vw);aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.hero-photo img{width:100%;height:100%;object-fit:cover}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1;letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.lead{font-size:1.12rem;max-width:34em;margin:0 0 22px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 18px;border-radius:8px;font-weight:600;text-decoration:none;font-size:.97rem;border:2px solid var(--text);color:var(--text);background:transparent;overflow-wrap:anywhere}
.btn:hover{background:var(--text);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}

/* recherche */
.ask{background:var(--panel);color:var(--panel-text);border-radius:14px;padding:22px var(--gutter) 24px;margin:0 0 56px}
.ask h2{font-family:var(--display);font-size:1.5rem;line-height:1.2;margin:0 0 6px;font-weight:700}
.ask p.sub{margin:0 0 16px;color:var(--panel-muted);font-size:.95rem;max-width:44em}
.ask form{display:flex;gap:10px;flex-wrap:wrap}
.ask label{position:absolute;inset-inline-start:-9999px}
.ask input[type=search]{flex:1 1 220px;min-width:0;font:inherit;font-size:1rem;padding:12px 14px;border-radius:8px;border:2px solid transparent;background:var(--panel-card);color:var(--panel-card-text)}
.ask input[type=search]::placeholder{color:#7A849E}
.ask button.go{font:inherit;font-weight:600;padding:12px 20px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
.ask button.go:hover{background:var(--accent-strong)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--panel-line);background:transparent;color:var(--panel-text);cursor:pointer}
.chip:hover{background:var(--panel-hover);border-color:var(--panel-muted)}
#results{margin-top:18px;display:grid;gap:10px}
.result{background:var(--panel-card);color:var(--panel-card-text);border-radius:10px;padding:14px 16px}
.result .src{display:inline-block;font-size:.82rem;font-weight:600;color:var(--link);background:var(--accent-wash);padding:2px 9px;border-radius:999px;margin-bottom:6px}
.result p{margin:0}
mark{background:var(--marker);color:var(--marker-text);padding:0 2px;border-radius:3px}
.note{font-size:.9rem;color:var(--panel-muted);margin:2px 0 0}
.note.empty{color:var(--panel-text)}

/* sections */
section.block{padding:0 0 56px}
h2.title{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.1;letter-spacing:-.01em;margin:0 0 22px;text-wrap:balance}
.project{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 28px;padding:22px 0;border-top:1px solid var(--line)}
.project:first-of-type{border-top:0;padding-top:0}
.project .meta{color:var(--muted);font-size:.93rem}
.project h3{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;margin:0 0 6px}
.project p{margin:0 0 8px;max-width:46em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.tags li{font-size:.85rem;padding:3px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.project .links{margin-top:10px;display:flex;gap:16px;font-weight:600;font-size:.95rem}
.project.featured{background:var(--accent-wash);border-radius:12px;padding:22px var(--gutter);border-top:0;margin-bottom:12px}
.status{display:inline-block;font-size:.85rem;font-weight:600;background:var(--accent);color:var(--on-accent);padding:2px 10px;border-radius:999px;margin-bottom:8px}

dl.skills{margin:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px 28px}
dl.skills dt{font-weight:600;margin-top:12px}
dl.skills dt:first-child{margin-top:0}
dl.skills dd{margin:0;color:var(--muted)}

.rows{display:grid;gap:18px}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 28px}
.row .when{color:var(--muted);font-size:.93rem}
.row strong{font-weight:600}
.row .org{color:var(--muted)}

.contact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px var(--gutter);margin-bottom:56px}
.contact p{margin:0 0 16px;max-width:40em}
footer{padding:0 0 36px;color:var(--muted);font-size:.9rem}

@media (min-width:720px){
  :root{--gutter:32px}
  .hero{grid-template-columns:minmax(0,1fr) 250px;gap:48px;padding:28px 0 44px}
  .hero-photo{grid-column:2;grid-row:1;width:250px}
  .ask{padding:30px 36px 32px}
  .project{grid-template-columns:190px minmax(0,1fr)}
  .project.featured{padding:26px 28px}
  dl.skills{grid-template-columns:240px minmax(0,1fr)}
  dl.skills dt{margin-top:0}
  dl.skills dd{margin-bottom:6px}
  .row{grid-template-columns:190px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

      en: "Engineering cycle, 5th year, Artificial Intelligence and Data Science, EMSI, Rabat. Looking for a PFE internship in AI for 2026–2027.",
      ar: "السلك الهندسي، السنة الخامسة، الذكاء الاصطناعي وعلوم البيانات، EMSI الرباط. أبحث عن تدريب PFE في الذكاء الاصطناعي للسنة 2026–2027." } },
  { tags: "certificat oracle google agile big data certificates certification شهادات",
    src: { fr: "Certifications", en: "Certifications", ar: "الشهادات" },
    text: {
      fr: "Oracle AI Database Certified Foundations Associate (2026), Introduction to Big Data (UC San Diego, 2026), Agile Project Management (Google, 2026).",
      en: "Oracle AI Database Certified Foundations Associate (2026), Introduction to Big Data (UC San Diego, 2026), Agile Project Management (Google, 2026).",
      ar: "Oracle AI Database Certified Foundations Associate (2026), Introduction to Big Data (UC San Diego, 2026), Agile Project Management (Google, 2026)." } }
];

/* ---- Stockage léger (préférences seulement) ---- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

let lang = "fr";
const root = document.documentElement;

/* ---- Recherche ---- */
const STOP_RAW = ("le la les de des du un une et en au aux pour sur avec ce ces que qui quoi dans par est sont avez vous je mon ma mes tu ton as a il elle on ou ne pas plus se sa son ses y d l c s j m n t qu quels quel quelle quelles " +
  "the an of and in on for with to is are do you your have has what which how my i me it its at by from " +
  "في من على إلى مع و عن هل ما ماذا كيف هذا هذه أو أن أنا هي هو").split(" ");
const norm = s => s.normalize("NFD").replace(/[̀-ًͯ-ٰٟ]/g, "").toLowerCase()
  .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
const STOP = new Set(STOP_RAW.map(norm));
const stem = w => {
  if (/^[؀-ۿ]/.test(w)) return (w.startsWith("ال") && w.length > 4) ? w.slice(2) : w;
  return (w.length > 3 && w.endsWith("s")) ? w.slice(0, -1) : w;
};
const terms = s => norm(s).split(/[^\p{L}\p{N}]+/u).filter(w => w.length > 1 && !STOP.has(w)).map(stem);

let docs = [], df = {};
function buildDocs() {
  docs = CHUNKS.map(c => ({
    src: c.src[lang], text: c.text[lang],
    set: new Set(terms(c.text[lang] + " " + c.tags + " " + c.src[lang]))
  }));
  df = {};
  docs.forEach(d => d.set.forEach(t => { df[t] = (df[t] || 0) + 1; }));
}
function search(q) {
  const qt = [...new Set(terms(q))];
  if (!qt.length) return { qt, hits: [] };
  const hits = docs.map(d => {
    let s = 0;
    qt.forEach(t => { if (d.set.has(t)) s += Math.log(1 + docs.length / df[t]); });
    return { d, s };
  }).filter(h => h.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
  return { qt, hits };
}
const esc = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
function highlight(text, qt) {
  const set = new Set(qt);
  return text.split(/([\p{L}\p{M}\p{N}]+)/u).map(part =>
    (/^[\p{L}\p{M}\p{N}]+$/u.test(part) && set.has(stem(norm(part)))) ? "<mark>" + esc(part) + "</mark>" : esc(part)
  ).join("");
}

const resultsEl = document.getElementById("results");
const input = document.getElementById("q");
function run(q) {
  if (!q.trim()) { resultsEl.innerHTML = ""; return; }
  const { qt, hits } = search(q);
  if (!hits.length) {
    resultsEl.innerHTML = '<p class="note empty">' + esc(UI[lang].none(q)) + '</p>';
    return;
  }
  resultsEl.innerHTML = '<p class="note">' + UI[lang].count(hits.length) + '</p>' +
    hits.map(h => '<div class="result"><span class="src">' + esc(h.d.src) + '</span><p>' + highlight(h.d.text, qt) + '</p></div>').join("");
}
document.getElementById("ask-form").addEventListener("submit", e => { e.preventDefault(); run(input.value); });
input.addEventListener("search", () => run(input.value));

/* ---- Rendu par langue ---- */
const ghUrl = GITHUB_USER ? "https://github.com/" + GITHUB_USER : "";
["gh-hero", "gh-contact"].forEach(id => {
  const a = document.getElementById(id);
  if (ghUrl) { a.href = ghUrl; a.hidden = false; }
});

function renderProjects() {
  const el = document.getElementById("projects");
  el.innerHTML = "";
  PROJECTS.forEach(p => {
    const art = document.createElement("article");
    art.className = "project" + (p.featured ? " featured" : "");
    const links = (GITHUB_USER && p.repo)
      ? '<div class="links"><a href="https://github.com/' + GITHUB_USER + '/' + p.repo + '">' + UI[lang].repo_link + '</a></div>' : "";
    art.innerHTML =
      '<div class="meta">' + p.meta[lang] + '</div>' +
      '<div>' + (p.status ? '<span class="status">' + p.status[lang] + '</span>' : '') +
      '<h3>' + p.title[lang] + '</h3><p>' + p.text[lang] + '</p>' +
      '<ul class="tags">' + p.tags.map(t => '<li>' + t + '</li>').join("") + '</ul>' + links + '</div>';
    el.appendChild(art);
  });
}
function renderSkills() {
  document.getElementById("skills").innerHTML =
    SKILLS.map(s => '<dt>' + s.dt[lang] + '</dt><dd>' + s.dd[lang] + '</dd>').join("");
}
function renderRows() {
  document.getElementById("rows").innerHTML =
    ROWS.map(r => '<div class="row"><div class="when">' + r.when[lang] + '</div><div>' + r.html[lang] + '</div></div>').join("");
}
function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  UI[lang].chips.forEach(label => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label;
    b.addEventListener("click", () => { input.value = label; run(label); });
    el.appendChild(b);
  });
}

function effectiveTheme() {
  const a = root.getAttribute("data-theme");
  if (a === "dark" || a === "light") return a;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function updateThemeLabel() {
  document.getElementById("theme").textContent = effectiveTheme() === "dark" ? UI[lang].theme_light : UI[lang].theme_dark;
}
document.getElementById("theme").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  store.set("pf-theme", next);
  updateThemeLabel();
});
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeLabel); } catch (e) {}

function applyLang(l) {
  lang = UI[l] ? l : "fr";
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = UI[lang].title;
  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute("content", UI[lang].desc);
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = UI[lang][el.dataset.i18nPh]; });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", UI[lang][el.dataset.i18nAria]); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  renderProjects(); renderSkills(); renderRows(); renderChips();
  buildDocs();
  updateThemeLabel();
  run(input.value);
}
document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => { store.set("pf-lang", b.dataset.lang); applyLang(b.dataset.lang); }));

/* ---- Démarrage : préférences enregistrées, sinon français et thème du système ---- */
const savedTheme = store.get("pf-theme");
if (savedTheme === "dark" || savedTheme === "light") root.setAttribute("data-theme", savedTheme);
const urlLang = new URLSearchParams(location.search).get("lang");
applyLang(urlLang && UI[urlLang] ? urlLang : (store.get("pf-lang") || "fr"));
</script>
</body>
